---
# - name: set hostname
#   command: hostnamectl --static set-hostname {{ inventory_hostname }}


- name: Install packages
  ansible.builtin.package:
    name:
      - postfix
      - postfix-ldap
      - postfix-pcre
    state: present
  tags:
    - apt
  notify:
    - Restart postfix

- name: Discover default configuration values
  ansible.builtin.command: postconf -d
  register: _postfix_config_defaults
  changed_when: false
  check_mode: false

- name: Register default configuration values
  ansible.builtin.set_fact:
    postfix_config_defaults: "{{ dict(_postfix_config_defaults.stdout_lines
                                      | map('regex_replace', '^(\\w+ =)$', '\\1 ')
                                      | map('split', ' = ', 1)) }}"

- name: Check compatibility level
  ansible.builtin.fail:
    msg: "Postfix {{ postfix_config_defaults.mail_version }} requires mta_compatibility_level: 2"
  when:
    - mta_compatibility_level | string is version('3.6', '>=')
    - postfix_config_defaults.mail_version is version('3.6', '<')

- name: "Postfix: deploy privacy header checks"
  ansible.builtin.template:
    src: postfix/privacy_header_checks.pcre
    dest: /etc/postfix/
    mode: "0644"
  when: mta_msa_privacy
  tags:
    - postfix
  notify:
    - Reload postfix

- name: Instanciate config files
  ansible.builtin.template:
    src: postfix/{{ item }}
    dest: /etc/postfix/{{ item }}
    mode: "0644"
    lstrip_blocks: true
  with_items:
    - master.cf
    - main.cf
  tags:
    - postfix
    - psotfix-spf
  notify:
    - Restart postfix

- name: Generate additional config files
  ansible.builtin.template:
    src: postfix/config
    dest: /etc/postfix/{{ item.name }}
    mode: "0600"
    owner: root
    group: root
  with_items: "{{ mta_config_files }}"
  notify:
    - Restart postfix

- name: Create policy and access database directories
  ansible.builtin.file:
    path: "/etc/postfix/{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  with_items:
    - access.d
    - policy.d
    - policy.d/client_restrictions
    - policy.d/sender_restrictions
    - policy.d/relay_restrictions
    - policy.d/recipient_restrictions

- name: Update access databases
  ansible.builtin.template:
    src: postfix/access
    dest: "{{ item.key }}"
    mode: "{{ item.value.mode | default('0664') }}"
    owner: "{{ item.value.owner | default('root') }}"
    group: "{{ item.value.group | default('root') }}"
  with_dict: "{{ mta_access_databases }}"
  register: access_database_update

- name: Compile access databases
  ansible.builtin.command: postmap "{{ '%s:%s' | format(item.item.value.type, item.item.key) }}"
  changed_when: true
  when: item is changed  # noqa: no-handler
  with_items: "{{ access_database_update.results | default([]) }}"
  notify:
    - Reload postfix

- name: Update alias tables
  ansible.builtin.template:
    src: postfix/aliases
    dest: "{{ item.file }}"
    mode: "{{ item.mode | default('0664') }}"
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
  with_items: "{{ mta_alias_database }}"
  tags:
    - postfix_virtual_map
  register: alias_map_update

- name: Compile alias tables
  ansible.builtin.command: postalias "{{ '%s:%s' | format(item.item.type, item.item.file) }}"
  changed_when: true
  when: item is changed  # noqa: no-handler
  with_items: "{{ alias_map_update.results | default([]) }}"
  notify:
    - Reload postfix
  tags:
    - postfix_virtual_map

- name: Update virtual tables
  ansible.builtin.template:
    src: postfix/virtual
    dest: /etc/postfix/virtual_{{ item.domain }}
    mode: "0644"
  when: item is mapping
  with_items: "{{ mta_virtual_alias_maps | default(omit) }}"
  tags:
    - postfix_virtual_map
  register: virtual_map_update

- name: Compile virtual tables
  ansible.builtin.command: postmap /etc/postfix/virtual_{{ item.item.domain }}
  changed_when: true
  when: item is changed  # noqa: no-handler
  with_items: "{{ virtual_map_update.results | default([]) }}"
  notify:
    - Reload postfix
  tags:
    - postfix_virtual_map

- name: "Postfix: create map directory"
  ansible.builtin.file:
    state: directory
    path: /etc/postfix/maps/
    owner: postfix
    group: postfix
    mode: ug=rwx,o-rwx
  register: map_infrastructure
  tags:
    - postfix-map
    - postfix-map-hash
    - postfix-map-ldap

- name: "Postfix: hack to ensure that aliases.db can be written by postfix"
  ansible.builtin.command: chown postfix:postfix /etc/aliases.db
  changed_when: false
  failed_when: false
  tags:
    - postfix-map
    - postfix-map-hash

- name: "Postfix: build hashes"
  ansible.builtin.import_tasks: postfix-build-hashes.yml
  tags:
    - postfix-map
    - postfix-map-hash

- name: "Postfix: build rfc address tables"
  ansible.builtin.import_tasks: postfix-build-rfc-address-tables.yml
  tags:
    - postfix-map
    - postfix-map-hash
    - postfix-map-rfc

- name: "Postfix: build ldap configurations"
  ansible.builtin.import_tasks: postfix-build-ldap-configs.yml
  tags:
    - postfix-map
    - postfix-map-ldap

- name: Create alias include dir
  ansible.builtin.file:
    path: /etc/postfix/aliases.d/
    mode: "0755"
    state: directory

- name: Create placeholder file
  ansible.builtin.copy:
    dest: /etc/postfix/aliases.d/placeholder.aliases
    mode: "0644"
    content: ""

- name: Force alias includer generation at this point
  ansible.builtin.command: /bin/true
  changed_when: true
  notify:
    - Update include alias file

- name: Update transport map
  ansible.builtin.template:
    src: postfix/transport_map
    dest: /etc/postfix/transports
    mode: "0644"
  when: mta_transport_map is mapping
  tags:
    - postfix_transport_map
  register: postfix_transport_map

- name: Compile transport map
  ansible.builtin.command: postmap /etc/postfix/transports
  changed_when: true
  when: postfix_transport_map is changed  # noqa: no-handler
  tags:
    - postfix_transport_map

- name: Deploy sasl password map for relaying
  ansible.builtin.template:
    src: postfix/password_map
    dest: "{{ mta_relayhost_auth_mapfile }}"
    mode: "0600"
  when: mta_relayhost is truthy and mta_relayhost_auth_username is truthy
  register: password_map
  notify:
    - Reload postfix

- name: Compile sasl password map for relaying
  ansible.builtin.command: postmap "{{ mta_relayhost_auth_mapfile }}"
  changed_when: true
  when: password_map is changed  # noqa: no-handler
  notify:
    - Reload postfix

- name: "Postfix: upload MTA certificate"
  ansible.builtin.copy:
    content: "{{ mta_tls_cert }}"
    dest: /etc/postfix/mta.crt
    owner: root
    group: root
    mode: ugo=r
  when: mta_listen and mta_tls and not mta_tls_cert_file and mta_tls_cert | default(false) is truthy
  notify:
    - Reload postfix
  tags:
    - certificate

- name: "Postfix: upload MTA key"
  ansible.builtin.copy:
    content: "{{ mta_tls_key }}"
    dest: /etc/postfix/mta.key
    owner: root
    group: root
    mode: u=r,go-rwx
  when: mta_listen and mta_tls and not mta_tls_key_file and mta_tls_key | default(false) is truthy
  notify:
    - Reload postfix
  tags:
    - certificate
    - requires-secrets

- name: "Postfix: upload MSA certificate"
  ansible.builtin.copy:
    content: "{{ mta_msa_tls_cert }}"
    dest: /etc/postfix/msa.crt
    owner: root
    group: root
    mode: u=r,go-rwx
  when: "mta_msa and mta_msa_tls and not mta_msa_tls_cert_file and mta_msa_tls_cert is defined"
  notify:
    - Reload postfix
  tags:
    - certificate

- name: "Postfix: link MSA certificate"
  ansible.builtin.file:
    state: link
    src: "{{ mta_msa_tls_cert_file }}"
    dest: /etc/postfix/msa.crt
    force: true
  when: "mta_msa and mta_msa_tls and not not mta_msa_tls_cert_file"
  notify:
    - Reload postfix
  tags:
    - certificate

- name: "Postfix: upload MSA key"
  ansible.builtin.copy:
    content: "{{ mta_msa_tls_key }}"
    dest: /etc/postfix/msa.key
    owner: root
    group: root
    mode: u=r,go-rwx
  when: "mta_msa and mta_msa_tls and not mta_msa_tls_key_file and mta_msa_tls_key is defined"
  notify:
    - Reload postfix
  tags:
    - certificate
    - requires-secrets

- name: "Postfix: link MSA key"
  ansible.builtin.file:
    state: link
    src: "{{ mta_msa_tls_key_file }}"
    dest: /etc/postfix/msa.key
    force: true
  when: "mta_msa and mta_msa_tls and not not mta_msa_tls_key_file"
  notify:
    - Reload postfix
  tags:
    - certificate

- name: Import spf policyd task set
  ansible.builtin.import_tasks: postfix-spf-policyd.yml
  when: mta_spf
  tags:
    - postfix
    - postfix-spf

- name: Import ferm task set
  ansible.builtin.import_tasks: postfix-ferm.yml
  when: "ferm | default(False)"
  tags:
    - ferm

- name: Import nft task set
  ansible.builtin.import_tasks: postfix-nft.yml
  when: "nft | default(False)"
  tags:
    - nft

- name: Start and enable postfix
  ansible.builtin.service:
    name: postfix
    state: started
    enabled: true

- name: "Postfix: upload collectd scripts"
  ansible.builtin.copy:
    src: queuesize.sh
    dest: /usr/local/bin/
    mode: ugo=rx
