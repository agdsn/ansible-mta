---
- name: "spampd: install spampd"
  ansible.builtin.apt:
    name: "{{ item }}"
    state: latest
  with_items:
  - spampd
  tags:
  - apt

- name: "spampd: configure spampd"
  ansible.builtin.template:
    src: spampd/default.j2
    dest: /etc/default/spampd
  notify:
  - restart spampd

- name: "spampd: enable and start spampd"
  ansible.builtin.service:
    name: spampd
    state: started
    enabled: yes
